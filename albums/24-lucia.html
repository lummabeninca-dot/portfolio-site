<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUCIA — Luma Benincá</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#fff;color:#000;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}

/* NAV */
.nav{padding:10px 28px;font-size:13px;letter-spacing:0.02em;text-transform:uppercase;display:flex;gap:0;align-items:center;border-bottom:1px solid #e8e8e8;position:sticky;top:0;background:#fff;z-index:100;}
.nav a{font-weight:900;font-size:13px;text-transform:uppercase;}
.nav-sep{margin:0 6px;font-weight:900;}

/* HEADER */
.album-header{
  padding:48px 28px 28px;
  border-bottom:1px solid #000;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
}
.album-num{font-size:11px;font-weight:700;letter-spacing:0.18em;color:#999;}
.album-title{font-size:clamp(32px,5vw,72px);font-weight:900;letter-spacing:-0.02em;line-height:1;text-transform:uppercase;}
.album-sub{font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#666;margin-top:6px;}
.album-count{font-size:11px;font-weight:700;letter-spacing:0.12em;color:#999;text-align:right;}

/* GRID */
.photo-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  padding:20px 32px;
}
@media(max-width:1200px){
  .photo-grid{grid-template-columns:repeat(4,1fr);}
}
@media(max-width:768px){
  .photo-grid{grid-template-columns:repeat(3,1fr);gap:2px;padding:0;}
  .photo-item{aspect-ratio:1/1;}
}

.photo-item{
  position:relative;
  overflow:hidden;
  background:#e4e2de;
  aspect-ratio:9/16;
  cursor:default;
}
.photo-item img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .7s ease;
}
.photo-item:hover img{transform:scale(1.05);}
.photo-item video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s ease;, opacity .25s ease;
  opacity:0;
}
.photo-item video.playing{opacity:1;}
.photo-item:hover video{transform:scale(1.05);}
.video-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;background:rgba(255,255,255,0.55);border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;transition:opacity .25s ease;backdrop-filter:blur(4px);}
.video-play::after{content:'';border-left:26px solid rgba(255,255,255,1);border-top:15px solid transparent;border-bottom:15px solid transparent;margin-left:7px;}
.photo-item:hover .video-play{opacity:0;}

/* LIGHTBOX */
.lb{
  position:fixed;inset:0;background:rgba(0,0,0,0.95);
  z-index:999;display:none;
  align-items:center;justify-content:center;
}
.lb.active{display:flex;}
.lb-img{max-width:92vw;max-height:92vh;object-fit:contain;display:block;}
.lb-close{
  position:fixed;top:20px;right:24px;
  font-size:28px;color:#fff;cursor:default;
  font-weight:300;line-height:1;z-index:1001;
}
.lb-prev,.lb-next{
  position:fixed;top:50%;transform:translateY(-50%);
  font-size:24px;color:#fff;cursor:default;
  background:none;border:none;padding:20px;
  font-weight:300;z-index:1001;
}
.lb-prev{left:8px;}
.lb-next{right:8px;}

/* FOOTER */
.footer{margin-top:80px;padding:18px 28px;border-top:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:center;}
.footer p{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#888;}
</style>
</head>
<body>

<nav class="nav">
  <a href="../portfolio.html">← LUMA BENINCÁ</a>
  <span class="nav-sep">/</span>
  <span>LUCIA</span>
</nav>

<div class="album-header">
  <div>
    <div class="album-num">(24)</div>
    <div class="album-title">LUCIA</div>
  </div>
  <div class="album-count" id="photo-count"></div>
</div>

<div class="photo-grid" id="photo-grid"></div>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <span class="lb-close" onclick="closeLb()">✕</span>
  <button class="lb-prev" onclick="lbNav(-1)">&#8592;</button>
  <div id="lb-media"></div>
  <button class="lb-next" onclick="lbNav(1)">&#8594;</button>
</div>

<footer class="footer">
  <p>Luma Benincá Photography © 2025</p>
  <p>SP ___ RJ ___ ES</p>
</footer>

<script>
const photos = [
  'dsc03908-2.jpg',
  'dsc03911-2.jpg',
  'dsc03780-2.jpg',
  'dsc03682-2.jpg',
  'dsc03643.jpg',
  'dsc03632.jpg',
  'dsc03628-2.jpg',
  'dsc03948-2.jpg',
  'dsc03944-2.jpg',
  'dsc03933.jpg',
  'dsc03963.jpg',
  'dsc04230-2.jpg',
  'dsc04051.jpg',
  'dsc032952.jpg',
  'dsc04054.jpg',
  'dsc04040.jpg',
  'dsc04098-4.jpg',
  'dsc04152.jpg',
  'dsc04193-2.jpg',
  'dsc04203-2.jpg',
  'dsc04444.jpg',
  'dsc04461-2.jpg',
  'dsc033282.jpg',
  'dsc033282-2.jpg',
  'dsc03711-2.jpg',
  'dsc03846.jpg',
  'dsc03650.jpg',
  'dsc03650-3.jpg',
  'dsc03645.jpg',
  'dsc03186.jpg',
  'dsc03853.jpg',
  'dsc03139.jpg',
  '65389628-3906-455a-ba41-2df0420dbc12_afterlight-3.jpg',
  'b512bd52-0960-4a82-8374-fc7b94336fe9.jpg',
];

const BASE = '../images/albums/lucia/';
const grid = document.getElementById('photo-grid');
const countEl = document.getElementById('photo-count');

function isVideo(name){ const n=name.toLowerCase(); return n.endsWith('.mp4')||n.endsWith('.mov'); }

countEl.textContent = photos.length + (photos.length === 1 ? ' arquivo' : ' arquivos');
photos.forEach((name, i) => {
  const item = document.createElement('div');
  item.className = 'photo-item';
  if (isVideo(name)) {
    const posterName = name.replace(/\.[^.]+$/, '.jpg');
    const posterUrl = `${BASE}preview/${posterName}`;
    item.style.backgroundSize = 'cover';
    item.style.backgroundPosition = 'center';
    item.innerHTML = `<video src="${BASE}${name}" muted loop playsinline preload="metadata"></video><div class="video-play"></div>`;
      const v = item.querySelector('video');
      const probe = new Image();
      probe.onload = () => { item.style.backgroundImage = `url("${posterUrl}")`; };
      probe.onerror = () => { v.style.opacity = '1'; };
      probe.src = posterUrl;
      item.addEventListener('mouseenter', () => { const p = v.play(); if (p) p.then(() => v.classList.add('playing')).catch(() => {}); });
      item.addEventListener('mouseleave', () => { v.classList.remove('playing'); v.pause(); v.currentTime = 0; });
  } else {
    item.innerHTML = `<img src="${BASE}${name}" alt="" loading="lazy">`;
  }
  item.onclick = () => openLb(i);
  grid.appendChild(item);
});

let current = 0;
function openLb(i) {
  current = i;
  showLbItem(i);
  document.getElementById('lb').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function showLbItem(i) {
  const lb = document.getElementById('lb-media');
  const name = photos[i];
  if (isVideo(name)) {
    lb.innerHTML = `<video src="${BASE}${name}" controls autoplay style="max-width:92vw;max-height:92vh;display:block;"></video>`;
  } else {
    lb.innerHTML = `<img src="${BASE}${name}" alt="" style="max-width:92vw;max-height:92vh;object-fit:contain;display:block;">`;
  }
}
function closeLb() {
  document.getElementById('lb').classList.remove('active');
  document.getElementById('lb-media').innerHTML = '';
  document.body.style.overflow = '';
}
function lbNav(dir) {
  current = (current + dir + photos.length) % photos.length;
  showLbItem(current);
}
document.getElementById('lb').addEventListener('click', function(e) {
  if (e.target === this) closeLb();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('active')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});
</script>
</body>
</html>
